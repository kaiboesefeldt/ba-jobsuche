name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: Version prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version und Hinweise prüfen
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          git cat-file -e "$base^{commit}"
          version=$(cat skills/ba-jobsuche/VERSION)
          notes="docs/releases/$version.md"
          if git cat-file -e "$base:skills/ba-jobsuche/VERSION" 2>/dev/null; then
            previous=$(git show "$base:skills/ba-jobsuche/VERSION")
            python3 scripts/check_release.py skills/ba-jobsuche/VERSION "$notes" --previous "$previous"
          else
            python3 scripts/check_release.py skills/ba-jobsuche/VERSION "$notes"
          fi
  publish:
    name: Release veröffentlichen
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Stabiles Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          version=$(cat skills/ba-jobsuche/VERSION)
          export version
          tag="v$version"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['version']
          payload = {'tag_name': 'v' + version, 'name': 'v' + version,
                     'target_commitish': os.environ['EVENT_SHA'],
                     'body': Path('docs/releases/' + version + '.md').read_text(),
                     'draft': False, 'prerelease': False, 'make_latest': 'legacy'}
          Path('/tmp/release.json').write_text(json.dumps(payload))
          Path('/tmp/tag.json').write_text(json.dumps({'ref': 'refs/tags/v' + version,
                                                      'sha': os.environ['EVENT_SHA']}))
          PY
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -d @/tmp/tag.json "https://api.github.com/repos/$REPOSITORY/git/refs" > /dev/null
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -d @/tmp/release.json "https://api.github.com/repos/$REPOSITORY/releases" > /dev/null
